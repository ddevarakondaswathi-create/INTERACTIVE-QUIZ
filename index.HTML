<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Quiz App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="quiz-container" id="quiz-box">
        <!-- Start Screen -->
        <div id="start-screen" class="screen">
            <h1>Welcome to the Quiz</h1>
            <button id="start-btn">Start Quiz</button>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="screen hidden">
            <div class="quiz-header">
                <span id="progress">Question 1 of 5</span>
                <span id="timer">Time: 15s</span>
            </div>
            <div class="progress-bar-container">
                <div id="progress-bar"></div>
            </div>
            <h2 id="question-text">Question text goes here?</h2>
            <div id="options-container" class="options-grid">
                <!-- JavaScript will inject buttons here -->
            </div>
            <button id="next-btn" class="hidden">Next Question</button>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="screen hidden">
            <h1>Quiz Completed!</h1>
            <p id="score-text">You scored 0 out of 0</p>
            <button id="restart-btn">Try Again</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
